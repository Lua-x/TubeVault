[project]
name = "tubevault"
version = "0.1.0"
description = "Self-hosted media server for YouTube content"
readme = "../README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142",
  "uvicorn[standard]>=0.54",
  "sqlalchemy>=2.1",
  "alembic>=1.20",
  "pydantic-settings>=2.15",
  "argon2-cffi>=25.1",
  "yt-dlp[default,deno]>=2026.8.19",
  # Used to update yt-dlp at runtime without rebuilding the image.
  "pip>=25",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "httpx2>=2.13",
  "ruff>=0.16",
  "mypy>=2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",  # assert is fine in tests
  "S104",  # binding to 0.0.0.0 is intended inside the container
  "B008",  # FastAPI dependencies in defaults
  "RUF001", "RUF002", "RUF003",  # German texts use typographic dashes and quotes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S311"]  # demo data, not cryptography
"app/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/migrations/"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
