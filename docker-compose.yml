# TubeVault – build and run locally:  docker compose up -d
# To use the prebuilt image instead, replace `build: .` with
#   image: ghcr.io/lua-x/tubevault:latest
services:
  tubevault:
    build: .
    container_name: tubevault
    ports:
      - "8096:8096"
    # Optional: DLNA for smart TVs (Einstellungen → Fernseher im Heimnetz). TVs find servers
    # by multicast, which only reaches the container in the host network – `ports:` is then
    # ignored and TubeVault listens on port 8096 of the host directly.
    # network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      # Optional: create the admin account on first start
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=change-me-please
      # Optional: serve below a sub-path behind a reverse proxy
      # - BASE_PATH=/tubevault
      # Optional: login via Authelia, Authentik, Keycloak, … (see README → Anmeldung)
      # - PUBLIC_URL=https://tube.example.com
      # - OIDC_ISSUER=https://auth.example.com
      # - OIDC_CLIENT_ID=tubevault
      # - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # - OIDC_NAME=Authelia
    volumes:
      - ./config:/config
      - ./media:/media
      # Optional: existing videos to import (Verwaltung → Import); read-only is fine for copying
      # - ./import:/import
    # Optional: hardware transcoding with an Intel or AMD GPU (VAAPI)
    # devices:
    #   - /dev/dri:/dev/dri
    # Optional: hardware transcoding with an NVIDIA GPU (needs the NVIDIA Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    restart: unless-stopped
