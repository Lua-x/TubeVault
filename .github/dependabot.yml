# Weekly pull requests for outdated or vulnerable dependencies. Security fixes come
# right away; minor and patch updates are grouped so there is one PR per area.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Types follow the Node version of the Docker build (node:24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # A new TypeScript major needs typescript-eslint and friends to catch up first.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

