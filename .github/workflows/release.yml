name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release was created in the GitHub UI together with the tag: fill in our notes.
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --title "TubeVault ${TAG}" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "TubeVault ${TAG}" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" --title "TubeVault ${TAG}" --generate-notes --verify-tag
          fi
