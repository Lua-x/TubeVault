name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase for GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tubevault" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # latest follows main only; a (re)built older tag must never move it back.
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # Build for amd64 first and check the image before anything is pushed.
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tubevault:smoke
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha

      - name: Smoke test
        run: |
          set -eu
          encoders="$(docker run --rm --entrypoint ffmpeg tubevault:smoke -hide_banner -encoders)"
          for encoder in libx264 h264_vaapi h264_nvenc aac; do
            echo "$encoders" | grep -q " $encoder " || { echo "::error::ffmpeg lacks $encoder"; exit 1; }
          done
          docker run --rm --entrypoint ffmpeg tubevault:smoke -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x360:duration=2 -c:v libx264 -f null -
          docker run -d --name smoke -p 8096:8096 \
            -e ADMIN_USER=admin -e ADMIN_PASSWORD=smoke-test-1234 -e YTDLP_AUTO_UPDATE=false \
            tubevault:smoke
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8096/api/health && break
            sleep 2
          done
          curl -fs http://127.0.0.1:8096/api/health
          curl -fs http://127.0.0.1:8096/ | grep -q '<base href="/" />'
          docker logs smoke 2>&1 | tail -n 20
          docker rm -f smoke

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
